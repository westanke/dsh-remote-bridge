name: CI

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.19.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm pack

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  profile-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').mkdirSync('artifacts',{recursive:true})"
      - run: pnpm pack --pack-destination artifacts
        # Tarball 名含包名与版本号，两者都会随发版变化。写死任何一个具体名字（比如改名前的
        # `dsh-workspace-1.0.0.tgz`）都意味着改名或升版后下面两步找不到文件，而失败信息只是
        # 「文件不存在」，看不出真正原因是名字过时了。这里从 package.json 推出来。
      - name: resolve tarball name
        id: tarball
        shell: bash
        run: |
          echo "file=$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # 上游 0.2.1-rc.2 的 release commit。
          #
          # 2026-10-20 从 47f9438（0.2.0-rc.2 基线）换过来：那个基线上的
          # **web profile 自身起不来 sessionController**（smoke-profile-install 报
          # "pending (waiting for services: sessionController, workspaceController,
          # settingsController, credentialsController)"）—— 依赖没齐，entry 永远
          # INACTIVE，与插件本身无关。而本仓真正推荐的内核是 0.2.1-rc.2
          # （engines.dsh 声明 >=0.2.0-rc.2 <0.3.0，0.2.1 是完整功能那一版），
          # CI 就该测**当前推荐的那个**。
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: deepseek-harness
      - working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/smoke-profile-install.ts deepseek-harness "artifacts/${{ steps.tarball.outputs.file }}"
      - if: matrix.os == 'ubuntu-latest'
        working-directory: deepseek-harness
        run: pnpm build
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/daw-runtime-home"
          (cd deepseek-harness && pnpm dsh plugin --profile web add "$GITHUB_WORKSPACE/artifacts/${{ steps.tarball.outputs.file }}")
          (cd deepseek-harness && node --import tsx/esm apps/cli/src/bin.ts web --port 43992) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:43992/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:3090/api/v1/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  kotlin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: kotlin-sdk
        run: chmod +x gradlew && ./gradlew test --no-daemon
