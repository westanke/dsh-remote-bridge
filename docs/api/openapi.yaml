openapi: 3.1.0
info:
  title: DeepSeek Harness Mobile API
  version: 2.5.1
  description: Versioned file and chat BFF for mobile and third-party DSH clients. HTTP and HTTPS are both supported.
servers:
  - url: http://127.0.0.1:3090/api/v1
    description: Default listener; the bind IP and port are configurable from the local DSH WebUI
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Listener is alive without exposing host details.
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, pluginVersion]
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string, const: v1 }
                  pluginVersion: { type: string, const: 2.5.1 }
  /debug/host-services:
    get:
      operationId: hostServices
      summary: Host service injection probe
      description: |
        Reports which DSH host services the plugin actually resolved on the running
        kernel. This plugin deliberately imports no `@deepseek-ai/*` package and
        consumes every host service through a structural type injected by the Host,
        so "is the service there at all" is otherwise unanswerable without guessing.

        `injected` covers the services named in the plugin's `inject` declaration;
        `observed` covers services confirmed present in the web profile but not yet
        consumed (currently only `workingDirectory`, added by DSH 0.2.1).

        Requires a device token or loopback admin **with the `settings.read`
        scope** (a loopback admin inherits all scopes): it exposes host
        internals. Since 2.5.2 the endpoint sits behind authentication like
        every other `/api/v1` route (SEC-H1); it previously returned before the
        principal was resolved. The response may additionally carry a
        best-effort `metrics` object with runtime diagnostics; it is omitted in
        builds without the metrics collector (and a missing probe still yields
        `404`, not `500`).
      responses:
        '200':
          description: Injection probe snapshot taken while the plugin applied.
          content:
            application/json:
              schema:
                type: object
                required: [pluginVersion, injected, observed, summary]
                properties:
                  pluginVersion: { type: string }
                  injected:
                    type: array
                    items:
                      type: object
                      required: [name, available, resolvable]
                      properties:
                        name: { type: string }
                        available: { type: boolean }
                        resolvable: { type: boolean }
                        error: { type: string }
                  observed:
                    type: array
                    items:
                      type: object
                      required: [name, available, resolvable]
                      properties:
                        name: { type: string }
                        available: { type: boolean }
                        resolvable: { type: boolean }
                        error: { type: string }
                  summary:
                    type: object
                    required: [injectedTotal, injectedAvailable, injectedMissing, observedAvailable]
                    properties:
                      injectedTotal: { type: integer }
                      injectedAvailable: { type: integer }
                      injectedMissing: { type: array, items: { type: string } }
                      observedAvailable: { type: array, items: { type: string } }
                  metrics:
                    type: object
                    description: |
                      Optional runtime diagnostics attached to the same
                      `settings.read`-gated report (no separate route). Omitted
                      when the build has no metrics collector. Shape is
                      diagnostic and additive.
                    additionalProperties: true
        '404':
          description: The probe is not compiled into this build.
  /pairings/exchange:
    post:
      security: []
      operationId: exchangePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string, minLength: 8 }
                deviceName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Device token returned exactly once.
          content:
            application/json:
              schema:
                type: object
                required: [token, device]
                properties:
                  token: { type: string }
                  device: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /devices/self:
    get:
      operationId: getCurrentDevice
      responses:
        '200':
          description: Current device grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
  /roots:
    get:
      operationId: listRoots
      responses:
        '200':
          description: Roots granted to this device. Absolute host paths are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Root' }
        '403': { $ref: '#/components/responses/Error' }
  /roots/resolve:
    get:
      operationId: resolveAbsolutePath
      summary: Map a host absolute path to its authorized root
      description: |
        Chat events carry server-absolute paths while `GET /roots` deliberately
        omits root absolute paths, so clients cannot perform this mapping
        themselves. Resolves `path` against the device's authorized roots using
        realpath-normalized longest-prefix matching, then stat-checks the
        target (rejecting symlinks inside the path) via the same machinery as
        file content reads. The response never contains an absolute host path.
        Requires `files.read`.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute host path. Relative paths are rejected rather than guessed.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Root match plus wire-relative metadata for the target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPath' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /roots/{rootId}/entries:
    parameters:
      - $ref: '#/components/parameters/RootId'
    get:
      operationId: listEntries
      parameters:
        - $ref: '#/components/parameters/Path'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: One lazy directory page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, kind]
              properties:
                path: { $ref: '#/components/schemas/WirePath' }
                kind: { type: string, enum: [file, directory] }
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: moveEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, destinationPath]
              properties:
                path: { $ref: '#/components/schemas/WirePath' }
                destinationPath: { $ref: '#/components/schemas/WirePath' }
      responses:
        '200':
          description: Entry moved or renamed.
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: trashEntry
      parameters:
        - $ref: '#/components/parameters/RequiredPath'
      responses:
        '200':
          description: Entry moved to plugin trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashItem' }
        '403': { $ref: '#/components/responses/Error' }
  /roots/{rootId}/content:
    parameters:
      - $ref: '#/components/parameters/RootId'
      - $ref: '#/components/parameters/RequiredPath'
    get:
      operationId: readContent
      parameters:
        - name: Range
          in: header
          schema: { type: string, examples: [bytes=0-1023] }
      responses:
        '200':
          description: Complete raw file content. ETag is always returned.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '206':
          description: One byte range.
        '416': { $ref: '#/components/responses/Error' }
    put:
      operationId: writeContent
      parameters:
        - name: If-Match
          in: header
          description: Required for an existing file.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: Must be `*` when creating a file.
          schema: { type: string, const: '*' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        '200':
          description: Atomic replacement completed.
          headers:
            ETag: { schema: { type: string } }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /trash:
    get:
      operationId: listTrash
      responses:
        '200':
          description: Trash items belonging to granted roots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrashItem' }
  /trash/{trashId}/restore:
    post:
      operationId: restoreTrash
      parameters:
        - name: trashId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item restored without overwriting an existing path.
        '409': { $ref: '#/components/responses/Error' }
  /image-handoff:
    get:
      operationId: readImageHandoff
      summary: Fetch one handoff image for a chat session
      description: |
        Returns the raw bytes of an image the agent handed off (content-addressed
        `sha256.<ext>` files written under the session working directory's
        image-handoff subdirectory). `name` must be a bare file name only: the
        directory is always derived by the host from the session working
        directory, so no directory or absolute path can be supplied. Requires
        `files.read` plus ownership of the session; "no such session" and "no
        such file" are indistinguishable (both are 404). This authenticated REST
        route is the device-side counterpart of the token-less browser route
        `GET /plugin/dsh-remote-bridge/raw`.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: true
          description: Bare handoff file name, e.g. `a1b2…e9.png`.
          schema: { type: string, pattern: '^[0-9a-f]{64}\.[A-Za-z0-9]+$' }
      responses:
        '200':
          description: Image bytes; handoff files are temporary artifacts, so the response is private and must be revalidated.
          headers:
            Cache-Control: { schema: { type: string }, description: private, max-age=0, must-revalidate }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /attachments/{attachmentId}:
    get:
      operationId: readAttachment
      summary: Fetch one session attachment's bytes
      description: |
        Returns the raw bytes of an image attachment referenced by a session
        event. The attachment store is content-addressed, so `attachmentId`
        contains a colon (typically `sha256:<hex>`) and **must be
        percent-encoded in the URL** (`sha256%3A<hex>`). `sessionId` is a
        required query parameter: the host verifies the session actually
        references this attachment and validates bytes/media type against the
        real reference stored in the session event. Requires `files.read` plus
        ownership of the session. Bytes are immutable and may be cached
        privately for a year.
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Content-addressed attachment id, e.g. `sha256%3A<hex>` (the raw id is `sha256:<hex>` and must be percent-encoded).
          schema: { type: string }
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attachment bytes; immutable and privately cacheable.
          headers:
            Cache-Control: { schema: { type: string }, description: private, max-age=31536000, immutable }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/workspaces:
    get:
      operationId: listChatWorkspaces
      description: Lists DSH WebUI workspaces whose canonical directory is inside a root granted to the device. Server absolute paths are not returned.
      responses:
        '200':
          description: Authorized DSH workspace choices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatWorkspace' }
    post:
      operationId: createChatWorkspace
      description: Registers an existing authorized directory as a DSH WebUI workspace. The server absolute path is never accepted or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootId, path]
              properties:
                rootId: { type: string, format: uuid }
                path: { $ref: '#/components/schemas/WirePath' }
      responses:
        '201':
          description: DSH workspace created or idempotently resolved.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: '#/components/schemas/ChatWorkspace' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: renameChatWorkspace
      description: Renames a DSH WebUI workspace visible to this device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1 }
      responses:
        '200':
          description: Renamed workspace.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: '#/components/schemas/ChatWorkspace' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteChatWorkspace
      description: Removes only the DSH workspace registration. The directory, files, and session logs are preserved.
      responses:
        '200': { description: Workspace registration removed. }
        '404': { $ref: '#/components/responses/Error' }
  /chat/agent-presets:
    get:
      operationId: listAgentPresets
      description: Lists the same Agent presets offered by DSH WebUI without exposing their composition files.
      responses:
        '200':
          description: Agent preset choices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentPreset' }
  /chat/permission-presets:
    get:
      operationId: listPermissionPresets
      description: >-
        Lists the permission presets a session can switch between (the catalog behind
        DSH WebUI's access-mode selector). Session projections only carry the *current*
        value, so clients cannot enumerate the choices without this endpoint.
      responses:
        '200':
          description: Permission preset choices and the deployment default.
          content:
            application/json:
              schema:
                type: object
                required: [options, defaultPreset]
                properties:
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionOption' }
                  defaultPreset:
                    type: string
        '403': { $ref: '#/components/responses/Error' }
  /settings/providers:
    get:
      operationId: listProviderSettings
      description: Lists DSH model providers and credential status. Secret values are never returned.
      responses:
        '200':
          description: Provider configuration safe for display to an authorized device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSettings' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomProvider
      description: Creates a fully custom llm-pi-ai provider using the protocols reported by ProviderSettings.customProvider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomProviderCreate' }
      responses:
        '201':
          description: Custom provider created; secret values are omitted from the response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /settings/plugins:
    get:
      operationId: listPlugins
      description: Lists every package the active profile declares or loads, with its resolved state.
      parameters:
        - name: checkUpdates
          in: query
          required: false
          schema: { type: string, enum: ['1'] }
          description: 'When `1`, also queries the npm registry for each installed third-party package. Adds seconds to the response, so it is opt-in.'
      responses:
        '200':
          description: 'Plugin inventory. `available: false` plus a `reason` means the profile could not be resolved or read; the endpoint does not fail for that.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInventory' }
    patch:
      operationId: setPluginLoaded
      description: |
        Enables or disables a plugin by adding or removing its name in `dsh.profile.bundles`.
        Dependency declarations are left alone (the package stays on disk and can be re-enabled
        without downloading), and no package install runs. A backup of the profile manifest is
        written before any change. **Bundles are read only at startup**, so the running DSH keeps
        the previous set until it restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, loaded]
              properties:
                name: { type: string, examples: [dsh-ffmpeg] }
                loaded: { type: boolean, description: 'true to enable, false to disable.' }
      responses:
        '200':
          description: 'Applied. The response carries `restartRequired: true`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginToggleResult' }
        '400':
          description: 'Bad request, official package, or package not installed. Error codes: REQUEST_INVALID, PLUGIN_NAME_INVALID, PLUGIN_OFFICIAL_IMMUTABLE, PLUGIN_NOT_INSTALLED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 'The profile could not be resolved or its manifest could not be read. Error codes: PROFILE_UNKNOWN, MANIFEST_UNREADABLE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /settings/models:
    get:
      operationId: listModelCatalog
      responses:
        '200':
          description: Models currently available through DSH providers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalog' }
  /settings/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateProvider
      description: Updates provider settings and optionally writes an API key to the DSH credential store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderPatch' }
      responses:
        '200':
          description: Updated provider list without secret values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSettings' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeProvider
      parameters:
        - name: expectedRevision
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '204': { description: Custom provider removed. }
        '409': { $ref: '#/components/responses/Error' }
  /settings/providers/{providerId}/discover:
    post:
      operationId: discoverProviderModels
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseURL: { type: string }
                api: { type: string }
                apiKey: { type: string, writeOnly: true }
      responses:
        '200':
          description: Models reported by the provider.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderModel' }
  /chat/sessions:
    get:
      operationId: listChatSessions
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: false }
          description: |
            When true, return the **archived** sessions instead of the active ones.
            Archiving hides a session from every grouped surface (kernel semantics), so
            without this parameter a mobile client that archives a session could never see it
            again. Un-archiving is NOT part of this bridge: the adapter only wraps the kernel's
            `archiveSession`, and whether the kernel exposes an unarchive call is not verifiable
            from this repository.
      responses:
        '200':
          description: Sessions whose cwd is within a granted root.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatSession' }
    post:
      operationId: createChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [workspaceId]
                - required: [rootId, path]
              properties:
                workspaceId:
                  type: string
                  description: Preferred DSH WebUI workspace identity returned by listChatWorkspaces.
                rootId: { type: string, format: uuid }
                path: { $ref: '#/components/schemas/WirePath' }
                sessionId: { type: string }
                agentPreset: { type: string }
                clientRequestId: { type: string, maxLength: 200 }
      responses:
        '201': { description: DSH session created or idempotently returned. }
  /chat/sessions/{sessionId}:
    patch:
      operationId: renameChatSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1 }
      responses:
        '200': { description: Session title updated. }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/fork:
    post:
      operationId: forkChatSession
      description: Forks the session at the latest completed boundary, or at the supplied event sequence.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                atSeq: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Forked session created in the same DSH workspace.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/archive:
    post:
      operationId: archiveChatSession
      description: Archives the session from default workspace views while preserving its log.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session archived. }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/jobs:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSessionJobs
      summary: Background jobs a session can see
      description: |
        The roster this session can observe: its own jobs plus every unowned job.
        The kernel's owner fence is the only access rule, so `sessionId` is
        required and must not be guessed by the client.
      responses:
        '200':
          description: The complete roster (whole-set, not a page).
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/JobView' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/jobs/{jobId}/output:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
      - name: jobId
        in: path
        required: true
        schema: { type: string }
      - name: from
        in: query
        required: false
        description: Absolute byte offset to resume from (a prior response's `next`). Omitted starts at the oldest retained byte.
        schema: { type: integer }
    get:
      operationId: readJobOutput
      summary: Retained output of one background job
      responses:
        '200':
          description: Flattened output plus the offset to resume from.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, text, next, lossy]
                properties:
                  jobId: { type: string }
                  text: { type: string }
                  next: { type: integer }
                  lossy: { type: boolean }
                  status: { $ref: '#/components/schemas/JobStatus' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/jobs/{jobId}/kill:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: killSessionJob
      summary: Stop one background job on a human's behalf
      description: |
        Records `cancelled by the user` as the reason. The owning agent still
        receives its completion notice, because a human kill is not one the
        model requested.
      responses:
        '200':
          description: The registry's admission.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, outcome]
                properties:
                  jobId: { type: string }
                  outcome: { type: string, enum: [requested, already-finished] }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/messages:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listMessages
      parameters:
        - name: beforeSeq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxMessages
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: |
            DSH history events and continuation state. Subject to a byte budget
            (2 MiB per response, 512 KiB per event): the oldest events may be dropped
            (with `hasMore` forced to true) and oversized strings inside one event may be
            head/tail clamped (that element then carries `bridgeTruncated`). `truncated`
            and `bytes` appear only when something was actually clamped -- otherwise the
            payload is byte-for-byte what it was before the budget existed.
            `historyFormatVersion` is always present and describes the shape of `events`.
          content:
            application/json:
              schema:
                type: object
                required: [events, hasMore]
                properties:
                  events:
                    type: array
                    items: { type: object, additionalProperties: true }
                  hasMore: { type: boolean }
                  projections: { type: object, additionalProperties: true }
                  bytes: { type: integer, minimum: 0 }
                  truncated: { type: boolean }
                  historyFormatVersion: { type: integer, minimum: 1 }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
                mode: { type: string, enum: [queue, steer], default: queue }
                clientTimeZone: { type: string }
                clientRequestId: { type: string, maxLength: 200 }
      responses:
        '202': { description: Prompt accepted by DSH. }
        '409': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/attachments:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: uploadSessionAttachment
      summary: Upload one attachment and receive a receipt
      description: |
        Uploads one attachment as base64 text and returns the receipt a later
        message can reference. Kernel file-type content parts require this
        `receiptId` (obtained through an upload); only image content parts may
        be inlined as base64 directly in a message. Requires `chat.write` plus
        ownership of the session. The request body is limited to 24 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  contentEncoding: base64
                  minLength: 1
                  description: Base64-encoded attachment bytes.
                name:
                  type: string
                  description: Optional original file name; trimmed by the server.
      responses:
        '201':
          description: Stored; the receipt id is referenced by later message file parts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/approvals:
    get:
      operationId: listPendingApprovals
      description: Lists pending DSH approvals for an authorized session. Tool details are redacted and bounded; private DSH RPC identifiers are never exposed.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pending approvals visible to the current device.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PendingApproval' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      description: Allows a pending tool request once or rejects it. Persistent approval is intentionally unsupported.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [allowed-once, rejected] }
      responses:
        '202': { description: Decision accepted by DSH. }
        '409': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/questions:
    get:
      operationId: listUserQuestions
      description: |
        Lists questions an agent is waiting on, from two sources merged together:
        the ones this bridge is holding open (an `ask_user_question` call with no
        `timeout`, taken over from the host's `user-questions/request` waterfall),
        and the ones the kernel still accepts a late answer for (`continued`).
        A question held open is reported first; the same `callId` never appears twice.
        The `viaBridge` flag distinguishes the two. An unknown or inactive session
        yields an empty list rather than an error.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Questions the current device may answer.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [callId, state, questions]
                      properties:
                        callId: { type: string }
                        state: { type: string, enum: [continued] }
                        viaBridge:
                          type: boolean
                          description: True when the bridge is holding this question open, so the agent is blocked on it right now.
                        questions:
                          type: array
                          items:
                            type: object
                            required: [id, question]
                            properties:
                              id: { type: string }
                              question: { type: string }
                              header: { type: string }
                              detail: { type: string }
                              multiSelect: { type: boolean }
                              options:
                                type: array
                                items:
                                  type: object
                                  required: [label]
                                  properties:
                                    label: { type: string }
                                    description: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/questions/{callId}/answer:
    post:
      operationId: answerUserQuestion
      description: |
        Answers one question set. Answers for a question the bridge holds open are
        delivered as the return value of the tool call that is waiting; answers for a
        `continued` question are steered into the session as a new turn. The
        `selected` array carries option labels and must match the question's own
        options; use `custom` for free text.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: callId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [id, selected]
                    properties:
                      id: { type: string }
                      selected: { type: array, items: { type: string } }
                      custom: { type: string }
      responses:
        '202': { description: Answer accepted. }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/commands:
    get:
      operationId: listSessionCommands
      description: Lists the DSH host slash commands currently available to this authorized session.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current command directory.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CommandDescriptor' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: executeSessionCommand
      description: Executes a listed slash command through the DSH host command registry. The line is never sent to the model as a chat message.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string, minLength: 1, maxLength: 16384, pattern: '^/' }
      responses:
        '200':
          description: Settled DSH command execution.
          content:
            application/json:
              schema:
                type: object
                required: [execution]
                properties:
                  execution: { $ref: '#/components/schemas/CommandExecution' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/models:
    get:
      operationId: listSessionModels
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current selection and models routable for this DSH session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionModels' }
        '404': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/model:
    get:
      operationId: getSessionModelAlias
      description: |
        Alias of `GET /chat/sessions/{sessionId}/models`; the server route
        `model(?:s)?$` answers GET on both spellings. New clients should call
        `/models`.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current selection and models routable for this DSH session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionModels' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: selectSessionModel
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSelection' }
      responses:
        '200':
          description: Model selection accepted by DSH.
          content:
            application/json:
              schema:
                type: object
                required: [selected]
                properties:
                  selected: { $ref: '#/components/schemas/ModelSelection' }
        '409': { $ref: '#/components/responses/Error' }
  /chat/sessions/{sessionId}/agent-preset:
    put:
      operationId: selectSessionAgentPreset
      description: Changes the Agent preset only while the DSH session is blank. DSH locks the preset after the first accepted prompt.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentPreset]
              properties:
                agentPreset: { type: string, minLength: 1 }
      responses:
        '200':
          description: Agent preset recomposed and selected.
          content:
            application/json:
              schema:
                type: object
                required: [agentPreset]
                properties:
                  agentPreset: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /chat/runs/{id}/cancel:
    post:
      operationId: cancelRun
      description: In v1 the run id is the owning DSH session id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Cancellation accepted. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit-token
  parameters:
    RootId:
      name: rootId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Path:
      name: path
      in: query
      required: false
      schema: { $ref: '#/components/schemas/WirePath' }
    RequiredPath:
      name: path
      in: query
      required: true
      schema: { $ref: '#/components/schemas/WirePath' }
  responses:
    Error:
      description: Versioned API error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    PluginEntry:
      type: object
      description: One package the active profile declares or loads. Contents are limited to these fields; the package manifest itself is never forwarded.
      required: [name, declared, installed, loaded, official, state, description, homepage, updateAvailable, latestVersion, toggleable]
      properties:
        name: { type: string, examples: [dsh-ffmpeg, '@liustack/modlens'] }
        declared:
          type: [string, 'null']
          description: Version range declared in `dependencies`, e.g. `^0.4.5`.
        installed:
          type: [string, 'null']
          description: Version actually present in the profile's node_modules.
        loaded:
          type: boolean
          description: Whether the name appears in `dsh.profile.bundles` (the load list; its order is the load order).
        official: { type: boolean, description: 'True for `@deepseek-ai/` packages, which ship with the runtime.' }
        state:
          type: string
          enum: [loaded, runtime-provided, installed-not-loaded, declared-missing]
          description: '`runtime-provided` is normal, not a problem: those packages ship with DSH and are not installed under the profile.'
        description: { type: [string, 'null'] }
        homepage: { type: [string, 'null'], description: 'Normalized http(s) URL; git+ prefixes and .git suffixes are stripped.' }
        updateAvailable:
          type: [boolean, 'null']
          description: 'Tri-state on purpose: null means not checked, which differs from false ("already latest").'
        latestVersion: { type: [string, 'null'] }
        toggleable:
          type: boolean
          description: 'False for official packages and for packages not installed in the profile.'
    PluginInventory:
      type: object
      required: [profile, profilePath, available, reason, loadedCount, problemCount, items]
      properties:
        profile: { type: [string, 'null'], description: 'Resolved from DSH_PROFILE, `--profile`, or the `dsh <name>` subcommand shorthand.' }
        profilePath: { type: [string, 'null'] }
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [PROFILE_UNKNOWN, MANIFEST_UNREADABLE, null]
        loadedCount: { type: integer }
        problemCount: { type: integer, description: 'Counts installed-not-loaded and declared-missing; runtime-provided is not counted.' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PluginEntry' }
    PluginToggleResult:
      type: object
      description: Result of enabling or disabling a plugin. Only `dsh.profile.bundles` is rewritten; dependency declarations are never touched and no package install runs.
      required: [name, loaded, backupName, bundleCount, restartRequired]
      properties:
        name: { type: string }
        loaded: { type: boolean }
        backupName:
          type: string
          description: 'Name of the backup written before the change (empty for a no-op). A broken profile manifest means DSH will not boot, so a backup is mandatory.'
        bundleCount: { type: integer, description: 'New length of the bundles array.' }
        restartRequired:
          type: boolean
          description: 'Always true: bundles are read only at startup, so the running process keeps the old set until DSH restarts.'
    WirePath:
      type: string
      description: POSIX-style relative path. Absolute paths, backslashes, empty segments, dot segments, drive letters, UNC and null bytes are rejected.
      examples: [src/main.ts]
    Root:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        createdAt: { type: integer }
    ResolvedPath:
      type: object
      description: Result of mapping an absolute host path into an authorized root; the root's absolute path itself is never included.
      required: [rootId, path, kind, size, modifiedAt, contentType]
      properties:
        rootId: { type: string, format: uuid }
        path: { $ref: '#/components/schemas/WirePath' }
        kind: { type: string, enum: [file, directory] }
        size: { type: integer, nullable: true }
        modifiedAt: { type: integer, nullable: true }
        contentType: { type: string, nullable: true }
    AttachmentReceipt:
      type: object
      description: Upload receipt referenced later as a file-type content part in a message.
      required: [receiptId, name]
      properties:
        receiptId: { type: string }
        name: { type: string, nullable: true }
    Device:
      type: object
      required: [id, name, scopes, rootIds]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [chat.read, chat.write, files.read, files.write, files.delete, settings.read, settings.write] }
        rootIds:
          type: array
          items: { type: string }
    FileEntry:
      type: object
      required: [name, path, kind, size, modifiedAt, writable]
      properties:
        name: { type: string }
        path: { $ref: '#/components/schemas/WirePath' }
        kind: { type: string, enum: [file, directory, symlink, other] }
        size: { type: integer, minimum: 0 }
        modifiedAt: { type: number }
        writable: { type: boolean }
    DirectoryPage:
      type: object
      required: [path, entries]
      properties:
        path: { $ref: '#/components/schemas/WirePath' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/FileEntry' }
        nextCursor: { type: string }
    TrashItem:
      type: object
      required: [id, rootId, path, kind, size, createdAt, status]
      properties:
        id: { type: string, format: uuid }
        rootId: { type: string, format: uuid }
        path: { $ref: '#/components/schemas/WirePath' }
        kind: { type: string }
        size: { type: integer }
        createdAt: { type: integer }
        status: { type: string }
    ChatSession:
      type: object
      required: [id, rootId, cwd, updatedAt, running, blank]
      properties:
        id: { type: string }
        rootId: { type: string }
        cwd: { $ref: '#/components/schemas/WirePath' }
        cwdAbsolute:
          type: string
          description: >-
            Absolute path of the session working directory. Optional; older clients
            ignore it. Needed to compose `@absolute-path` mentions. Note that an
            empty `cwd` is legal and means the session working directory IS the
            authorized root itself.
        updatedAt: { type: integer }
        running: { type: boolean }
        blank: { type: boolean }
        title: { type: string }
        workspaceId: { type: string }
        workspaceTitle: { type: string }
        agentPreset: { type: string }
        pendingInteraction: { type: string, enum: [approval] }
    PendingApproval:
      type: object
      required: [id, sessionId, toolName, risk, requestedAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        toolName: { type: string, maxLength: 120 }
        reason:
          type: string
          maxLength: 500
          description: Redacted host reason suitable for display.
        detail:
          type: string
          maxLength: 1200
          description: Optional redacted tool or command preview.
        risk: { type: string, enum: [standard, full-access] }
        requestedAt: { type: integer }
    CommandDescriptor:
      type: object
      required: [name, description]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
        description: { type: string }
        input:
          type: object
          required: [hint]
          properties:
            hint: { type: string }
    CommandResult:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [success, error] }
        text: { type: string }
        sourceEventSeq: { type: integer, minimum: 0 }
    CommandExecution:
      type: object
      required: [commandId, result]
      properties:
        commandId: { type: string }
        result: { $ref: '#/components/schemas/CommandResult' }
    TodoItem:
      type: object
      required: [content, status]
      properties:
        content: { type: string }
        status: { type: string, enum: [pending, in_progress, completed] }
    PermissionOption:
      type: object
      required: [value, name]
      properties:
        value: { type: string }
        name: { type: string }
        description: { type: string }
    PermissionSelect:
      type: object
      required: [options, currentValue]
      properties:
        options:
          type: array
          items: { $ref: '#/components/schemas/PermissionOption' }
        currentValue: { type: string }
    ChatWorkspace:
      type: object
      required: [id, title, rootId, path, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        rootId: { type: string, format: uuid }
        path: { $ref: '#/components/schemas/WirePath' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentPreset:
      type: object
      required: [id, name, trust, isDefault, available]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        trust: { type: string, enum: [system, user] }
        isDefault: { type: boolean }
        available: { type: boolean }
    ModelSelection:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        reasoningEffort: { type: string }
    ModelReasoningEffort:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    ModelReasoning:
      type: object
      required: [efforts]
      properties:
        efforts:
          type: array
          items: { $ref: '#/components/schemas/ModelReasoningEffort' }
        defaultEffort: { type: string }
    Model:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        contextWindow: { type: integer, minimum: 1 }
        maxTokens: { type: integer, minimum: 1 }
        reasoning: { $ref: '#/components/schemas/ModelReasoning' }
    ModelProviderGroup:
      type: object
      required: [id, name, models]
      properties:
        id: { type: string }
        name: { type: string }
        models:
          type: array
          items: { $ref: '#/components/schemas/Model' }
    ModelFailure:
      type: object
      required: [provider, message]
      properties:
        provider: { type: string }
        message: { type: string }
    ModelCatalog:
      type: object
      required: [groups, failures]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/ModelProviderGroup' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/ModelFailure' }
    SessionModels:
      allOf:
        - $ref: '#/components/schemas/ModelCatalog'
        - type: object
          required: [current, routable]
          properties:
            current: { $ref: '#/components/schemas/ModelSelection' }
            routable: { type: boolean }
    ProviderModel:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string }
        contextWindow: { type: integer, minimum: 1 }
        maxTokens: { type: integer, minimum: 1 }
    ProviderConfig:
      type: object
      required: [models]
      properties:
        baseURL: { type: string }
        api: { type: string }
        displayName: { type: string }
        thinking: { type: string }
        reasoningEffort: { type: string }
        models:
          type: array
          items: { $ref: '#/components/schemas/ProviderModel' }
        modelsInherited:
          type: boolean
          description: True when the listed models come from the live DSH catalog rather than a stored provider override.
    CredentialState:
      type: object
      required: [ref, configured, writable]
      properties:
        ref: { type: string }
        configured: { type: boolean }
        source: { type: string }
        writable: { type: boolean }
    Provider:
      type: object
      required: [id, displayName, active, configurable, configured, removable, credential, config]
      properties:
        id: { type: string }
        displayName: { type: string }
        active: { type: boolean }
        declared: { type: boolean }
        configurable: { type: boolean }
        configured: { type: boolean }
        removable: { type: boolean }
        defaultBaseURL: { type: string, description: '目录供应商的适配器默认 API 地址（未配置时使用）。' }
        baseURLEnv:
          type: array
          items: { type: string }
          description: '可能覆盖默认地址的环境变量，按优先级排序。'
        nativeAuth: { $ref: '#/components/schemas/NativeAuthHint' }
        settingsNs:
          type: string
          description: 目录条目的设置命名空间；客户端用它捕获 expectedRevision（打开卡片那一刻的 revision）。
        credential: { $ref: '#/components/schemas/CredentialState' }
        config: { $ref: '#/components/schemas/ProviderConfig' }
    NativeAuthHint:
      type: object
      required: [env, oauth]
      properties:
        env:
          type: array
          items: { type: string }
          description: '适配器原生认证依赖的环境变量。'
        oauth: { type: boolean, description: '是否支持 OAuth 登录。' }
    ProviderSettings:
      type: object
      required: [writable, revisionByNamespace, customProvider, providers]
      properties:
        writable: { type: boolean }
        revisionByNamespace:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        customProvider:
          $ref: '#/components/schemas/CustomProviderCapability'
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
    ProviderPatch:
      type: object
      properties:
        displayName: { type: [string, 'null'] }
        baseURL: { type: [string, 'null'] }
        api: { type: [string, 'null'] }
        apiKey: { type: [string, 'null'], writeOnly: true }
        thinking: { type: [string, 'null'] }
        reasoningEffort: { type: [string, 'null'] }
        models:
          type: [array, 'null']
          description: '数组=整体替换模型目录（空数组=自定义空目录）；`null`=恢复适配器默认目录（unset）。'
          items: { $ref: '#/components/schemas/ProviderModel' }
        expectedRevision: { type: integer, minimum: 0 }
    CustomProviderCapability:
      type: object
      required: [available, protocols]
      properties:
        available: { type: boolean }
        protocols:
          type: array
          items: { type: string }
        revision: { type: integer, minimum: 0 }
    CustomProviderCreate:
      type: object
      required: [id, baseURL, api, models]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
        displayName: { type: string }
        baseURL: { type: string, minLength: 1 }
        api: { type: string, minLength: 1 }
        apiKey: { type: string, writeOnly: true }
        models:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProviderModel' }
        expectedRevision: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            details: { type: object, additionalProperties: true }
    JobStatus:
      type: string
      description: Lifecycle state. `running` and `stopping` are live; the rest are terminal.
      enum: [running, stopping, completed, killed, failed]
    JobView:
      type: object
      description: Read-only projection of one background job.
      required: [id, kind, label, status, startedAt]
      properties:
        id: { type: string, description: 'Registry-issued id, e.g. `bash-<short-uuid>`.' }
        kind: { type: string, description: 'Producer kind; `bash` is the only host-registered one today.' }
        label: { type: string, description: Producer-supplied one-line label. }
        owner: { type: string, description: Owning session; absent for an unowned job. }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: string, description: 'Live progress line (`3/10`); cleared at settlement.' }
        detail: { type: string, description: 'Terminal reason (`exit code: 3`); a recorded kill reason is merged in.' }
        startedAt: { type: integer, format: epoch-ms }
        finishedAt: { type: integer, format: epoch-ms, description: Absent while live. }
